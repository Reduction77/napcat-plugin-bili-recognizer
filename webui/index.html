<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>B站识别 · 控制台</title>
<script>
(()=>{const m=location.pathname.match(/^(.*?)\/plugin\/([^/]+)\//);const prefix=m?m[1]:'';const id=m?m[2]:'napcat-plugin-bili-recognizer';window.BILI_BASE=prefix+'/api/Plugin/ext/'+id;const base=prefix+'/plugin/'+id+'/files/static/';const css=document.createElement('link');css.rel='stylesheet';css.href=base+'style.css?v=1.5.1';document.head.append(css);const js=document.createElement('script');js.src=base+'app.js?v=1.5.1';js.defer=true;const details=document.createElement('script');details.src=base+'download-details.js?v=1.5.1';details.onload=()=>document.head.append(js);details.onerror=()=>{document.getElementById('content').textContent='页面组件加载失败，请完整覆盖插件文件并强制刷新。';};document.addEventListener("DOMContentLoaded",()=>document.head.append(details),{once:true});})();
</script></head><body>
<aside class="sidebar"><div class="brand"><div class="logo">b<span>站</span></div><div><strong>B站链接识别</strong><small>NAPCAT · CONTROL PANEL</small></div></div><div class="nav-label">工作空间</div><nav id="nav" aria-label="主导航"></nav><footer><span class="dot"></span> NapCat 原生插件 <small>v1.5.1</small><button id="theme" class="text-button">切换深色外观</button></footer></aside>
<div class="workspace"><header><div class="breadcrumbs">插件 / <span id="crumb">运行概览</span></div><div class="header-actions"><span id="connection" class="badge neutral">正在连接</span><button id="refresh" class="button subtle">↻ 刷新</button></div></header>
<main><div class="page-heading"><div><div class="eyebrow">BILIBILI LINK RECOGNIZER</div><h1 id="title">运行概览</h1><p id="subtitle">了解插件运行情况，让每一次分享都清晰可见。</p></div><div id="page-action"></div></div>
<div id="error-banner" class="notice error" hidden></div>
<section id="auth" class="card" hidden><h2>连接 NapCat 管理会话</h2><p>请先登录同一地址的 NapCat 管理面板，再重新连接。若当前窗口无法读取登录会话，可填写 NapCat 登录后获得的 Bearer 会话令牌。</p><label for="auth-token">会话令牌（仅本页面内存使用）</label><div class="inline"><input id="auth-token" type="password" autocomplete="off" placeholder="Bearer 会话令牌"><button id="auth-connect" class="button primary">重新连接</button></div></section>
<div id="content"><div class="empty card">正在加载控制台…</div></div>
</main><div class="bottom-note">B站链接识别 <span>·</span> 识别统计为本次运行 · 直播订阅与通知记录自动保存</div></div>
<div id="toast" role="status" aria-live="polite" hidden></div>
</body></html>
